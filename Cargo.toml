[workspace]
resolver = "3"
members = [
    "crates/core-domain",
    "crates/core-db",
    "crates/core-engines",
    "crates/core-modules",
    "crates/core-integrations",
    "crates/core-api",
    "crates/core-worker",
    "crates/plugin-sdk",
    "crates/core-pdf",
    "crates/onhold",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
core-domain = { path = "crates/core-domain" }
core-db = { path = "crates/core-db" }
core-engines = { path = "crates/core-engines" }
core-pdf = { path = "crates/core-pdf" }
core-modules = { path = "crates/core-modules" }
core-integrations = { path = "crates/core-integrations" }
core-api = { path = "crates/core-api" }
core-worker = { path = "crates/core-worker" }
plugin-sdk = { path = "crates/plugin-sdk" }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json", "ipnet"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "request-id", "timeout", "limit", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }
http-body-util = "0.1"
aes-gcm = "0.11"
argon2 = "0.6"
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
csv = "1"
data-encoding = "2"
dotenvy = "0.15"
getrandom = "0.4"
ipnet = "2"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
sha2 = "0.11"
subtle = "2"
time = "0.3"
totp-rs = { version = "6", features = ["otpauth"] }
url = "2"
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.3"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
croner = "4"
hmac = "0.13"
html2text = "0.17"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname", "pool"] }
minijinja = { version = "3", default-features = false, features = ["builtins", "serde", "json", "fuel", "debug", "macros", "multi_template", "adjacent_loop_items", "loop_controls", "std_collections", "urlencode", "preserve_order"] }
proptest = "1"
regex = "1"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
ammonia = "4"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
mail-parser = { version = "1", features = ["full_encoding"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev.package.sqlx-macros]
opt-level = 3

# Password hashing and test key generation are unbearably slow unoptimised;
# optimise just those crates in dev and test builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
