name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test, sqlx)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onhold
          POSTGRES_PASSWORD: onhold
          POSTGRES_DB: onhold
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onhold -d onhold"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://onhold:onhold@localhost:5432/onhold
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - name: Format
        run: cargo fmt --all --check
      - name: Offline query data is current
        run: |
          SQLX_OFFLINE=true cargo check --workspace --all-targets --locked
      - name: Migrations apply
        run: sqlx migrate run --source crates/core-db/migrations
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: sqlx prepare --check
        run: cargo sqlx prepare --workspace --check
      - name: Test
        run: cargo test --workspace --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile
          push: false
          tags: onhold:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cross-os:
    name: Build and unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      # Database-backed tests run on Linux, where CI has a Postgres service.
      - name: Unit tests
        run: cargo test --workspace --lib --bins --locked
      - name: Binary starts
        run: cargo run --locked -p onhold -- --help

  web:
    name: Web (types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The Rust job checks openapi.json against the handlers; this checks the
      # generated types against openapi.json.
      - name: Generated types match openapi.json
        run: |
          pnpm generate
          git diff --exit-code -- packages/api-client/src/schema.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Browser test of the demo flow
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onhold
          POSTGRES_PASSWORD: onhold
          POSTGRES_DB: onhold
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onhold -d onhold"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://onhold:onhold@localhost:5432/onhold
      SQLX_OFFLINE: "true"
      # A throwaway key: this database lives only for the job.
      ENCRYPTION_KEYS: ci:Y2ktb25seS1ub3QtYS1zZWNyZXQta2V5LTMyYnl0ZXM=
      PUBLIC_BASE_URL: http://localhost:5173
      COOKIE_SECURE: "false"
      ONHOLD_BIN: ${{ github.workspace }}/target/debug/onhold
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p onhold
      - run: target/debug/onhold migrate
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web/apps/app
      - run: pnpm e2e
        working-directory: web/apps/app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/apps/app/playwright-report
