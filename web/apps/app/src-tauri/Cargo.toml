# The desktop and mobile apps: a Tauri shell around the web app in `../dist`.
# Built on its own, outside the server's Cargo workspace, so the server's
# builds and CI never need the platform's web view libraries.
[package]
name = "onhold-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "UNLICENSED"

[lib]
name = "onhold_app_lib"
# The mobile builds need the static and dynamic library forms.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-opener = "=2.7.1"
gethostname = "1.1.0"

# The session token goes in the system's keychain where there is one.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[workspace]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
