# Advisories accepted after review. Each entry says why it cannot affect
# OnHold; remove it as soon as a fixed version is available upstream.
[advisories]
ignore = [
    # rsa 0.9 (Marvin attack): a timing leak in RSA *decryption and signing*
    # with a private key. It reaches us only through openidconnect, which we
    # use to *verify* ID token signatures with providers' public keys; we hold
    # no RSA private key in production. No fixed rsa release exists yet.
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5 (non-constant-time arithmetic): reaches us only through
    # openidconnect's p256/p384 for ECDSA signature *verification*, which
    # handles public values only. Fixed in 0.7.6, which openidconnect 4.0.1
    # (latest) cannot use yet.
    "RUSTSEC-2026-0387",
]
